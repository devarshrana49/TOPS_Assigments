<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>
</head>
<body>

<div id="box" style="
    width: 500px;
    height: 300px;
    border: 2px solid black;
">
    Click anywhere inside this box
</div>

<p id="coordinates"></p>

<script>
    document.getElementById("box").addEventListener("click", function(event) {

        let x = event.clientX;
        let y = event.clientY;

        document.getElementById("coordinates").innerHTML =
            "X: " + x + " Y: " + y;

    });
</script>

</body>
</html>
