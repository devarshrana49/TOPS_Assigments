<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>

<h2>Product</h2>

<button id="addCart">Add to Cart</button>

<h3>Cart</h3>
<ul id="cart"></ul>

<script>
    function addToCart() {

        let productName = "Wireless Headphones";

        let li = document.createElement("li");

        li.innerHTML = productName;

        document.querySelector("#cart").appendChild(li);
    }

    document.querySelector("#addCart").addEventListener("click", addToCart);
</script>

</body>
</html>
