<!DOCTYPE html>
<html>
<head>
    <title>Friend List</title>
</head>
<body>

<input type="text" id="friend" placeholder="Enter friend's name">
<button id="addFriend">Add Friend</button>

<ul id="friend-list"></ul>

<script>
    document.querySelector("#addFriend").addEventListener("click", function() {

        let friendName = document.querySelector("#friend").value;

        let li = document.createElement("li");

        li.innerHTML = friendName;

        document.querySelector("#friend-list").appendChild(li);

    });
</script>

</body>
</html>
